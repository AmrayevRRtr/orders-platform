AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SIS 3 - orders platform. Messaging (SNS -> SQS + DLQ -> idempotent Lambda -> DynamoDB)
  and container service (ECR -> ECS Fargate behind an ALB) in one reproducible stack.
  No hard-coded names: the same template can be deployed again under another stack name.

# ---------------------------------------------------------------------------
# Parameters: the only things that differ between environments or copies
# ---------------------------------------------------------------------------
Parameters:
  Env:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev
    Description: Environment. Picks the task size and count from the Sizing mapping.
  ImageTag:
    Type: String
    Default: ""
    Description: >-
      Image tag in the ECR repository (the git commit hash). Empty on the first deploy,
      because the repository does not exist yet: the ECS task definition and service are
      created only when a tag is given (see the HasImage condition).
  LogRetentionDays:
    Type: Number
    AllowedValues: [1, 3, 5, 7, 14, 30]
    Default: 7
    Description: Retention of the CloudWatch log groups (Lambda and ECS), in days.

Mappings:
  Sizing:
    dev:     { Cpu: "256", Memory: "512",  Count: 1 }
    staging: { Cpu: "512", Memory: "1024", Count: 2 }
    prod:    { Cpu: "512", Memory: "1024", Count: 2 }

Conditions:
  HasImage: !Not [!Equals [!Ref ImageTag, ""]]

Resources:
  # =========================================================================
  # NETWORK: one VPC, two public subnets in two AZs, no NAT gateway (no hourly cost)
  # =========================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-vpc" }

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-public-a" }

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-public-b" }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref PublicRouteTable

  # =========================================================================
  # MESSAGING (week 9): SNS topic -> SQS queue (+ DLQ) -> Lambda -> DynamoDB
  # Slide 22 values: visibility 60 s >= 6 x 5 s timeout + 5 s window, maxReceiveCount 5,
  # DLQ retention (14 d) longer than the source (4 d), ReportBatchItemFailures,
  # batch 10, window 5 s, maximum concurrency 2.
  # =========================================================================
  OrdersDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600 # 4 days
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrdersDLQ.Arn
        maxReceiveCount: 5

  OrderEventsTopic:
    Type: AWS::SNS::Topic

  # SNS may write to the queue only from this topic (aws:SourceArn condition)
  OrdersQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref OrdersQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSnsTopic
            Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt OrdersQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref OrderEventsTopic

  OrdersSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: OrdersQueuePolicy
    Properties:
      TopicArn: !Ref OrderEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt OrdersQueue.Arn
      RawMessageDelivery: true

  # The table is data: Retain keeps it when the stack is deleted or the resource is
  # replaced (scripts/destroy.sh removes it on purpose). No TableName: generated.
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: consumer-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt OrdersQueue.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt OrdersTable.Arn

  # Idempotency: the deduplication key is the business key orderId (not the SQS messageId).
  # One transaction writes the marker item ORDER#<orderId> (only if it does not exist) and
  # updates TOTALS. A duplicate cancels the whole transaction, so nothing is counted twice.
  ConsumerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.lambda_handler
      Role: !GetAtt ConsumerRole.Arn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Code:
        ZipFile: |
          import json
          import os
          from decimal import Decimal

          import boto3

          DDB = boto3.client("dynamodb")
          TABLE = os.environ["TABLE_NAME"]


          def is_duplicate(err):
              # TransactionCanceledException also happens on conflicts and throttling,
              # so look at the reason of the FIRST item (the marker)
              reasons = err.response.get("CancellationReasons") or []
              return bool(reasons) and reasons[0].get("Code") == "ConditionalCheckFailed"


          def process(body):
              event = json.loads(body, parse_float=Decimal)
              order_id = event["orderId"]  # deduplication key
              total = event["total"]
              if isinstance(total, bool) or not isinstance(total, (int, Decimal)):
                  raise ValueError("total must be a number")
              DDB.transact_write_items(TransactItems=[
                  {"Put": {
                      "TableName": TABLE,
                      "Item": {"pk": {"S": "ORDER#" + str(order_id)},
                               "customer": {"S": str(event.get("customer", ""))},
                               "total": {"N": str(total)}},
                      "ConditionExpression": "attribute_not_exists(pk)"}},
                  {"Update": {
                      "TableName": TABLE,
                      "Key": {"pk": {"S": "TOTALS"}},
                      "UpdateExpression": "ADD orders :one, revenue :t",
                      "ExpressionAttributeValues": {":one": {"N": "1"}, ":t": {"N": str(total)}}}},
              ])
              return order_id


          def lambda_handler(event, context):
              failed = []
              for record in event["Records"]:
                  msg_id = record["messageId"]
                  try:
                      order_id = process(record["body"])
                      print(json.dumps({"msg": "order processed", "orderId": order_id, "messageId": msg_id}))
                  except DDB.exceptions.TransactionCanceledException as e:
                      if is_duplicate(e):
                          print(json.dumps({"msg": "duplicate ignored", "messageId": msg_id}))
                      else:
                          print(json.dumps({"msg": "transaction cancelled", "messageId": msg_id}))
                          failed.append({"itemIdentifier": msg_id})
                  except Exception as e:
                      print(json.dumps({"msg": "processing failed", "messageId": msg_id, "error": repr(e)}))
                      failed.append({"itemIdentifier": msg_id})
              return {"batchItemFailures": failed}

  ConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ConsumerFunction}"
      RetentionInDays: !Ref LogRetentionDays

  ConsumerTrigger:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn: ConsumerLogGroup
    Properties:
      FunctionName: !Ref ConsumerFunction
      EventSourceArn: !GetAtt OrdersQueue.Arn
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: 2

  # =========================================================================
  # CONTAINER (week 10): ECR -> ECS Fargate behind an ALB, two separate roles
  # =========================================================================
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true # delete-stack must not fail on a repository that still holds images
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 5 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internet to the load balancer on port 80
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load balancer to the tasks on port 8080 only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: GatewayAttachment
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref TargetGroup }

  Cluster:
    Type: AWS::ECS::Cluster

  ServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: !Ref LogRetentionDays

  # Role 1: used by ECS itself to pull the image and write logs
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # Role 2: used by the application code (no permissions: the app calls no AWS API)
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: HasImage
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !FindInMap [Sizing, !Ref Env, Cpu]
      Memory: !FindInMap [Sizing, !Ref Env, Memory]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: app
          Image: !Sub "${Repository.RepositoryUri}:${ImageTag}"
          Essential: true
          PortMappings:
            - { ContainerPort: 8080, Protocol: tcp }
          Environment:
            - { Name: APP_ENV, Value: !Ref Env }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  Service:
    Type: AWS::ECS::Service
    Condition: HasImage
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !FindInMap [Sizing, !Ref Env, Count]
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ServiceUrl:
    Description: Open this in a browser (503 until the first image is deployed)
    Value: !Sub "http://${LoadBalancer.DNSName}"
  TopicArn:
    Value: !Ref OrderEventsTopic
  QueueUrl:
    Value: !Ref OrdersQueue
  DlqUrl:
    Value: !Ref OrdersDLQ
  TableName:
    Value: !Ref OrdersTable
  FunctionName:
    Value: !Ref ConsumerFunction
  RepositoryName:
    Value: !Ref Repository
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
